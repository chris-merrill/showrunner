<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Whatnot Chat Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <span id="dot" class="dot" data-state="idle"></span>
      <h1>Chat Helper</h1>
    </header>

    <label class="toggle">
      <input type="checkbox" id="highlightQuestions" />
      <span class="track"><span class="knob"></span></span>
      <span class="label">
        Highlight questions
        <em>Colours any chat line ending in “?”</em>
      </span>
    </label>

    <label class="toggle">
      <input type="checkbox" id="allowResolve" />
      <span class="track"><span class="knob"></span></span>
      <span class="label">
        Allow resolve
        <em>Adds a ✕ on hover to tick one off</em>
      </span>
    </label>

    <label class="toggle">
      <input type="checkbox" id="questionsTab" />
      <span class="track"><span class="knob"></span></span>
      <span class="label">
        Questions tab
        <em>Adds a tab beside Chat / Watching / Activity</em>
      </span>
    </label>

    <label class="toggle">
      <input type="checkbox" id="aiEnabled" />
      <span class="track"><span class="knob"></span></span>
      <span class="label">
        Smart detection
        <em>DIECASTr catches asks with no “?” in them</em>
      </span>
    </label>

    <section id="aiConfig" class="config" hidden>
      <label class="field">
        <span class="field-label">API key</span>
        <input type="password" id="token" placeholder="DIECASTr key" spellcheck="false" />
      </label>
      <label class="field">
        <span class="field-label">Endpoint <em>(leave as-is)</em></span>
        <input type="url" id="endpoint" spellcheck="false" />
      </label>
      <button id="saveAi" class="btn">Save</button>
      <p class="note" id="aiNote">
        Without a key, questions are detected locally by the “?” rule.
      </p>
    </section>

    <div class="foot">
      <span id="status">Checking…</span>
      <button id="reset" class="link">Reset ticks</button>
    </div>
  </body>
  <script src="popup.js"></script>
</html>
