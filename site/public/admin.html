<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Showrunner · Admin</title>
<link rel="icon" href="/icons/icon-32.png" sizes="32x32">
<meta name="theme-color" content="#0f0e14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0e14;--raised:#17161f;--line:#2a2837;--ink:#f2f0f7;--mute:#9b96b3;--yellow:#ffe500}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 48px}
nav{display:flex;align-items:center;justify-content:space-between;height:64px;border-bottom:1px solid var(--line);margin-bottom:20px}
.logo{display:flex;align-items:center;gap:10px;font:700 18px 'Space Grotesk',sans-serif;color:inherit;text-decoration:none}
.logo img{width:26px;height:26px;border-radius:7px}
.logo span{color:var(--mute);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#111}
.btn:disabled{opacity:.6;cursor:default}
.who{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px}
.center{display:grid;place-items:center;min-height:50vh;text-align:center;gap:14px}
h1{font:700 28px 'Space Grotesk',sans-serif;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 13px Inter,sans-serif;cursor:pointer}
.chip[data-on]{background:var(--yellow);border-color:var(--yellow);color:#111;font-weight:600}
.chip b{margin-left:4px}
.status{margin-left:auto;color:var(--mute);font-size:12px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card[data-status="done"]{opacity:.55}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;font-size:13px;color:var(--mute)}
.type{font:700 11px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.type.bug{background:#ff3b3022;color:#ff8787}.type.feature{background:#ffe50022;color:var(--yellow)}.type.feedback{background:#3ddc9722;color:#3ddc97}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;margin:0 0 10px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mute)}
.meta a{color:var(--yellow)}
.actions{margin-left:auto}
details{margin-top:10px;font-size:12px}
summary{cursor:pointer;color:var(--mute)}
pre{background:#0b0a10;border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;max-height:320px;font-size:11.5px}
.empty{color:var(--mute);text-align:center;padding:40px 0}
.err{color:#ff8787;font-size:13px}
@media (max-width:600px){.status{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="logo" href="/"><img src="/icons/icon-128.png" alt="">Showrunner <span>admin</span></a>
    <div class="who" id="who"></div>
  </nav>
  <main id="app"><div class="center"><p class="empty">Loading…</p></div></main>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signInWithRedirect, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

// Public web config (client-side by design). Project: showrunner-tools.
const app = initializeApp({
  apiKey: 'AIzaSyAw9JMZsAq6Skd1gUHqKjcS7yQWpJGnFz4',
  authDomain: 'showrunner-tools.firebaseapp.com',
  projectId: 'showrunner-tools',
  appId: '1:475370655942:web:5f85f28ac490488c4fc7c7',
});
const auth = getAuth(app);
const DB = 'https://firestore.googleapis.com/v1/projects/showrunner-tools/databases/(default)/documents';
const $app = document.getElementById('app');
const $who = document.getElementById('who');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CACHE = 'sr-admin-feedback';

let items = [];
let filter = 'new';
let loadedAt = 0;

function signedOut() {
  $who.textContent = '';
  $app.innerHTML = `<div class="center"><div><h1>Admin</h1><p style="color:var(--mute)">Sign in with Google to see feedback.</p>
    <button class="btn primary" id="go">Sign in with Google</button><p class="err" id="e"></p></div></div>`;
  document.getElementById('go').onclick = async () => {
    const p = new GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });
    try { await signInWithPopup(auth, p); }
    catch (err) {
      if (/popup/i.test(err.code || '')) return signInWithRedirect(auth, p);
      document.getElementById('e').textContent = err.message;
    }
  };
}

async function api(path, opts = {}) {
  const token = await auth.currentUser.getIdToken();
  const r = await fetch(`${DB}/${path}`, { ...opts, headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (!r.ok) { const e = new Error(`HTTP ${r.status}`); e.status = r.status; throw e; }
  return r.json();
}

const val = (f) => f ? (f.stringValue ?? f.integerValue ?? f.booleanValue ?? '') : '';

async function load() {
  const out = [];
  let pageToken = '';
  do {
    const j = await api(`feedback?pageSize=300${pageToken ? `&pageToken=${pageToken}` : ''}`);
    for (const d of j.documents || []) {
      const f = d.fields || {};
      out.push({
        id: d.name.split('/').pop(), at: d.createTime,
        type: val(f.type), message: val(f.message), email: val(f.email), version: val(f.version),
        page: val(f.page), diagnostics: val(f.diagnostics), status: val(f.status) || 'new',
      });
    }
    pageToken = j.nextPageToken || '';
  } while (pageToken);
  out.sort((a, b) => (a.at < b.at ? 1 : -1));
  items = out;
  loadedAt = Date.now();
  try { localStorage.setItem(CACHE, JSON.stringify(items)); } catch (_) {}
  render();
}

function ago(ts) {
  const s = Math.round((Date.now() - new Date(ts)) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function render() {
  const count = (k) => items.filter((i) => (k === 'all' ? true : k === 'new' || k === 'done' ? i.status === k : i.type === k)).length;
  const shown = items.filter((i) => (filter === 'all' ? true : filter === 'new' || filter === 'done' ? i.status === filter : i.type === filter));
  const chips = [['new', 'New'], ['done', 'Done'], ['bug', 'Bugs'], ['feature', 'Features'], ['feedback', 'Feedback'], ['all', 'All']]
    .map(([k, l]) => `<button class="chip" data-f="${k}" ${filter === k ? 'data-on' : ''}>${l}<b>${count(k)}</b></button>`).join('');
  const cards = shown.map((i) => {
    let diag = '';
    if (i.diagnostics) { try { diag = JSON.stringify(JSON.parse(i.diagnostics), null, 2); } catch (_) { diag = i.diagnostics; } }
    return `<article class="card" data-status="${esc(i.status)}">
      <div class="top"><span class="type ${esc(i.type)}">${esc(i.type || 'feedback')}</span>
        <span title="${esc(i.at)}">${ago(i.at)}</span>
        <span class="actions"><button class="btn" data-toggle="${esc(i.id)}" data-to="${i.status === 'done' ? 'new' : 'done'}">${i.status === 'done' ? 'Reopen' : 'Mark done'}</button></span></div>
      <p class="msg">${esc(i.message)}</p>
      <div class="meta">${i.email ? `<a href="mailto:${esc(i.email)}?subject=${encodeURIComponent('Your Showrunner ' + (i.type || 'feedback'))}">${esc(i.email)}</a>` : '<span>no email</span>'}
        <span>v${esc(i.version)}</span><span>${esc(i.page || '')}</span></div>
      ${diag ? `<details><summary>Diagnostics</summary><pre>${esc(diag)}</pre></details>` : ''}
    </article>`;
  }).join('');
  $app.innerHTML = `<div class="bar">${chips}<span class="status" id="st">${loadedAt ? `updated ${ago(loadedAt)}` : 'showing saved copy, refreshing…'} · <a href="#" id="rf" style="color:var(--yellow)">refresh</a></span></div>
    ${cards || '<p class="empty">Nothing here.</p>'}`;
  for (const b of $app.querySelectorAll('[data-f]')) b.onclick = () => { filter = b.dataset.f; render(); };
  for (const b of $app.querySelectorAll('[data-toggle]')) b.onclick = () => setStatus(b.dataset.toggle, b.dataset.to);
  document.getElementById('rf').onclick = (e) => { e.preventDefault(); load().catch(showErr); };
}

// Optimistic: the card moves at once; the write follows; put it back on failure.
async function setStatus(id, to) {
  const it = items.find((x) => x.id === id);
  if (!it) return;
  const was = it.status;
  it.status = to;
  render();
  try {
    await api(`feedback/${id}?updateMask.fieldPaths=status`, { method: 'PATCH', body: JSON.stringify({ fields: { status: { stringValue: to } } }) });
  } catch (err) {
    it.status = was;
    render();
    alert(`Couldn't save: ${err.message}`);
  }
}

function showErr(err) {
  const st = document.getElementById('st');
  if (st) st.textContent = `couldn't refresh (${err.message})`;
}

onAuthStateChanged(auth, async (user) => {
  if (!user) return signedOut();
  $who.innerHTML = `<span>${esc(user.email)}</span><button class="btn" id="so">Sign out</button>`;
  document.getElementById('so').onclick = () => { try { localStorage.removeItem(CACHE); } catch (_) {} signOut(auth); };
  try {
    await api(`admins/${user.uid}`);
  } catch (err) {
    $app.innerHTML = `<div class="center"><div><h1>Not an admin</h1><p style="color:var(--mute)">This account can't open the admin page.</p>
      <p style="color:var(--mute);font-size:12px">uid: ${esc(user.uid)}</p></div></div>`;
    return;
  }
  try { items = JSON.parse(localStorage.getItem(CACHE) || '[]'); } catch (_) { items = []; }
  render();
  load().catch(showErr);
  setInterval(() => load().catch(showErr), 30000);
});
</script>
</body>
</html>
